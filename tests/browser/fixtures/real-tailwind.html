<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture — real Tailwind CSS</title>
<!-- What Tailwind's base layer emits: --tw-* custom properties on every element -->
<style>*,::before,::after{--tw-ring-offset-width:0px;--tw-shadow:0 0 #0000}</style>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="mx-auto max-w-3xl p-6">
  <h1 class="text-3xl font-bold tracking-tight md:text-5xl">Tailwind fixture</h1>
  <div class="flex items-center justify-between gap-4 rounded-xl bg-white/80 p-4 shadow-md hover:bg-slate-100">x</div>
  <div class="w-[42px] h-[42px] rounded-full bg-indigo-500">y</div>
  <p class="text-sm text-slate-600 dark:text-slate-300">z</p>
  <button class="rounded-lg bg-blue-600 px-4 py-2 text-white hover:bg-blue-500 focus-visible:outline">Go</button>
</main>
<script src="/site.js"></script>
</body>
</html>
